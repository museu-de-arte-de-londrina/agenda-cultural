name: Publicar evento

# Uma issue preenchida pelo formulário vira uma proposta de alteração.
on:
  issues:
    # labeled também: quando o rótulo é aplicado junto com a criação, o payload
    # de opened pode chegar sem ele, e o trabalho era pulado sem explicação.
    types: [opened, edited, labeled]

permissions:
  contents: read

# Duas issues enviadas ao mesmo tempo escreveriam no mesmo arquivo. Em fila, a
# segunda parte do config.yaml já com o evento da primeira.
concurrency:
  group: publicar-evento
  cancel-in-progress: false

jobs:
  # Só automatiza para quem já tem acesso de escrita. O repositório é público e
  # qualquer pessoa pode abrir issue; de terceiros isso vira um pedido para
  # alguém ler, nunca uma alteração no repositório.
  #
  # A conferência olha a permissão real do repositório, e não o
  # author_association do payload: quem tem participação privada na organização
  # aparece ali como CONTRIBUTOR, e a automação recusava a própria equipe.
  conferir:
    name: Conferir quem pediu
    runs-on: ubuntu-latest
    # Fechada quer dizer publicada. Sem isso, editar a issue depois publicaria
    # o evento de novo.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'evento')

    permissions:
      contents: read
      issues: write

    outputs:
      pode: ${{ steps.acesso.outputs.pode }}

    steps:
      - name: Ler a permissão de quem abriu a issue
        id: acesso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: |
          nivel=$(gh api "repos/$REPO/collaborators/$AUTOR/permission" --jq .permission) || nivel=nenhum
          echo "Acesso de $AUTOR ao repositório: $nivel"
          case "$nivel" in
            admin | maintain | write) echo 'pode=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'pode=false' >> "$GITHUB_OUTPUT" ;;
          esac

      # Sem isso, quem preenche o formulário de fora fica esperando uma
      # resposta que nunca chega.
      - name: Avisar que o pedido vai para revisão
        if: steps.acesso.outputs.pode != 'true' && github.event.action != 'edited'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body \
            'Recebemos o pedido. A publicação automática vale só para quem cuida do repositório, então alguém da equipe do museu confere os dados e publica. Não precisa fazer mais nada por aqui.'

  publicar:
    name: Publicar o evento
    runs-on: ubuntu-latest
    needs: conferir
    if: needs.conferir.outputs.pode == 'true'

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Montar o evento a partir da issue
        id: montar
        continue-on-error: true
        env:
          # Por variável de ambiente, nunca interpolado no shell: o corpo da
          # issue é texto de fora e não pode virar comando.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/evento-da-issue.js 2> erro.txt

      - name: Avisar na issue o que deu errado
        if: steps.montar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          {
            echo "Não consegui publicar ainda:"
            echo
            cat erro.txt
            echo
            echo "Edite o formulário acima corrigindo isso e eu tento de novo."
          } > comentario.md
          gh issue comment "$NUMERO" --body-file comentario.md
          exit 1

      - name: Conferir que o site continua construindo
        run: |
          npm run validate
          npm test
          npm run build

      - name: Publicar no site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
          SITE: ${{ github.event.repository.homepage }}
        run: |
          set -euo pipefail

          # O script sai sem escrever quando o evento já está na agenda.
          if git diff --quiet -- config.yaml && [ -z "$(git status --porcelain src/assets/eventos)" ]; then
            gh issue comment "$NUMERO" --body 'Esse evento já está na agenda. Nada a fazer.'
            gh issue close "$NUMERO" --reason completed
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml src/assets/eventos

          cat > mensagem.txt <<FIM
          feat(agenda): novo evento vindo do formulário

          Publicado a partir da issue #$NUMERO, depois de passar pela validação
          do schema, pelos testes e por um build completo.
          FIM
          git commit --file mensagem.txt
          rm mensagem.txt

          # Outra issue pode ter publicado enquanto esta rodava. Refaz por cima
          # em vez de perder o evento.
          publicado=nao
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              publicado=sim
              break
            fi
            git pull --rebase origin main
          done
          [ "$publicado" = sim ]

          gh issue comment "$NUMERO" --body "Publicado. O site atualiza em cerca de um minuto: $SITE"
          gh issue close "$NUMERO" --reason completed
