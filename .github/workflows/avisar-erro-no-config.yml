name: Avisar erro no config

# O config.yaml é editado direto pela página do GitHub, por quem cuida da
# programação. Quando sai um erro de digitação, a publicação já é barrada e a
# página no ar continua a de antes, que é o que importa. O que faltava era
# alguém ficar sabendo: o aviso do GitHub cai por e-mail, em inglês, com o
# assunto de uma esteira que falhou, e é fácil não ver.
#
# Este trabalho abre uma issue em português explicando o erro e como arrumar, e
# fecha a issue sozinho quando o arquivo voltar ao normal.
on:
  push:
    branches: [main]
    paths:
      - config.yaml
      - schema/config.schema.js
      - lib/yaml-erro.js
  # Um alarme que nunca foi testado não é um alarme. Pelo disparo manual dá
  # para conferir o caminho inteiro, com a issue e tudo, sem precisar quebrar
  # o config.yaml de verdade na main para ver se funciona.
  workflow_dispatch:
    inputs:
      simular:
        description: Fingir que o config.yaml está quebrado, para testar o aviso
        type: boolean
        default: false

permissions:
  contents: read

# Duas edições seguidas não precisam de dois avisos: vale o estado atual.
concurrency:
  group: avisar-erro-no-config
  cancel-in-progress: true

jobs:
  conferir:
    name: Conferir o config.yaml
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      ETIQUETA: config com erro
      TITULO: O config.yaml está com um erro

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validar
        id: validar
        continue-on-error: true
        env:
          SIMULAR: ${{ inputs.simular }}
        run: |
          alvo=config.yaml
          if [ "$SIMULAR" = 'true' ]; then
            alvo=$RUNNER_TEMP/simulado.yaml
            printf "profile:\n  name: Museu\nevents:\n  - title: 'Teste do aviso'- sobra\n" > "$alvo"
          fi
          node scripts/validate-config.js "$alvo" 2> erro.txt

      - name: Abrir ou atualizar o aviso
        if: steps.validar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          AUTOR: ${{ github.event.head_commit.author.name || github.actor }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          set -euo pipefail

          # Sem --force o comando falha quando a etiqueta já existe, e aí o
          # aviso nunca sairia da segunda vez em diante.
          gh label create "$ETIQUETA" --force --color d73a4a \
            --description 'O config.yaml não está válido e o site parou de atualizar'

          # Por arquivo, nunca interpolado no shell: o texto do erro carrega a
          # linha do config.yaml, que é conteúdo e não comando.
          {
            if [ "${SIMULAR:-false}" = 'true' ]; then
              echo "> Teste do aviso, disparado à mão. O \`config.yaml\` de verdade está em ordem."
              echo
            fi
            echo "A última alteração no \`config.yaml\` tem um erro, então o site **parou de atualizar**."
            echo "A página no ar continua a de antes, sem nada quebrado."
            echo
            echo '```'
            cat erro.txt
            echo '```'
            echo
            echo "Veio de [\`${COMMIT:0:7}\`](https://github.com/$REPO/commit/$COMMIT), por $AUTOR."
            echo
            echo "Para arrumar: abra o \`config.yaml\`, clique no lápis, corrija a linha citada"
            echo "acima e salve. Esta issue fecha sozinha quando o arquivo voltar ao normal."
          } > aviso.md

          # Uma issue só, atualizada a cada tentativa, em vez de uma pilha delas.
          ABERTA=$(gh issue list --repo "$REPO" --state open --label "$ETIQUETA" \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --repo "$REPO" --body-file aviso.md
          else
            gh issue create --repo "$REPO" --title "$TITULO" \
              --label "$ETIQUETA" --body-file aviso.md
          fi

          exit 1

      - name: Fechar o aviso que já não vale
        if: steps.validar.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for numero in $(gh issue list --repo "$REPO" --state open --label "$ETIQUETA" \
            --json number --jq '.[].number'); do
            gh issue comment "$numero" --repo "$REPO" \
              --body 'O `config.yaml` voltou a ser válido e o site já está atualizando de novo.'
            gh issue close "$numero" --repo "$REPO" --reason completed
          done
