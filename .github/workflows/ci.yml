name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only ever needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + validate + test + build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Actions are pinned by full commit SHA: a tag can be moved to point at
      # different code, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate config.yaml
        run: npm run validate

      - name: Validate config.example.yaml
        run: node scripts/validate-config.js config.example.yaml

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
