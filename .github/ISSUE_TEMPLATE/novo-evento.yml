name: Publicar evento na agenda
description: Preencha os campos, confira e feche a issue. Não precisa mexer em código.
title: "[evento] "
labels: ["evento"]
body:
  - type: markdown
    attributes:
      value: |
        Enviar ainda não publica. Depois de enviar, releia o que ficou
        registrado e, quando estiver certo, clique em **Close issue**. É o
        fechamento que manda o robô publicar.

        Se algum campo estiver errado, ele comenta aqui dizendo o quê. Aí é
        reabrir a issue, corrigir este formulário e fechar de novo.

  - type: input
    id: titulo
    attributes:
      label: Título do evento
      description: Como aparece na agenda. Até 140 caracteres.
      placeholder: Apresentação de Taiko
    validations:
      required: true

  - type: input
    id: data-inicio
    attributes:
      label: Data
      description: No formato dia/mês/ano.
      placeholder: 21/09/2026
    validations:
      required: true

  - type: input
    id: hora-inicio
    attributes:
      label: Hora de início
      description: No formato hora:minuto. Deixe em branco se durar o dia todo.
      placeholder: "19:00"

  - type: input
    id: hora-fim
    attributes:
      label: Hora de término
      placeholder: "20:00"

  - type: input
    id: data-fim
    attributes:
      label: Último dia
      description: Só para o que dura vários dias, como exposição. Em branco se for de um dia só.
      placeholder: 27/09/2026

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de atividade
      options:
        - Exposição
        - Oficina
        - Show Musical
        - Teatro
        - Ação Educativa
        - Sarau
        - Exibição de Filme
        - Abertura
        - Visita Mediada
        - Outro

  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: Uma ou duas frases sobre o que acontece. Evite repetir o título. Até 300 caracteres.
      placeholder: Tambores japoneses, pelo 22º Londrina Matsuri.

  - type: textarea
    id: foto
    attributes:
      label: Foto do evento
      description: >-
        Arraste a imagem para dentro desta caixa, ou cole o endereço dela.
        Aceito JPG, PNG e WebP, até 5 MB. A foto é guardada junto com o site.
      placeholder: Arraste a foto aqui

  - type: input
    id: link
    attributes:
      label: Link para mais informações
      description: Endereço começando com https. Opcional.
      placeholder: https://londrinacultura.londrina.pr.gov.br/espaco/1/
