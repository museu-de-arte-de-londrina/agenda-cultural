# Único arquivo que precisa ser editado para mudar o site.
# Referência completa dos campos: README.md
# Antes de publicar, confira: npm run validate

lang: pt-BR

profile:
  name: Museu de Arte de Londrina
  location: Rua Sergipe, 640, Centro, Londrina, PR, 86010-380
  handle: "@museudeartedelondrina"
  handle_url: https://www.instagram.com/museudeartedelondrina/
  avatar: assets/museu-33-anos.webp
  avatar_shape: square
  hero: assets/museu-hero.webp

# Horário de funcionamento, mostrado logo abaixo dos ícones de contato.
# `note` é a condição que não cabe no nome dos dias.
hours:
  - days: Terça a sexta
    time: 11h às 17h
  - days: 2 primeiros sábados do mês
    time: 9h às 13h
    note: a partir do 5º dia útil

# Contagem de acesso. Painel em https://museu-de-arte-de-londrina.goatcounter.com
# Apagar estas duas linhas desliga a contagem e devolve a página ao estado em
# que ela não fala com terceiro nenhum. Detalhes no README, seção `analytics`,
# e no SECURITY.md.
analytics:
  goatcounter: museu-de-arte-de-londrina

theme:
  mode: auto
  accent: "#004080"

# Destaques: o que o museu oferece sem dia marcado. Aparece acima da agenda,
# sem data, sem horário e sem botão de calendário.
# `until` não aparece na página: é só o dia em que o cartão sai sozinho. Sem
# `until`, o item fica até alguém apagar.
ongoing:
  - title: Gira Mundo e Coleção Vladimir Kozák
    kind: Exposição
    image: assets/eventos/em-exposicao-202609141100.webp
    url: https://blog.londrina.pr.gov.br/?p=209580
    description: '"Gira Mundo" (22 obras do acervo do Museu de Arte de Londrina) e “A Riqueza de um
      patrimônio em movimento”, sobre a vida, expedições e acervo de Vladimir Kozák, engenheiro
      e pesquisador tcheco que documentou povos indígenas brasileiros, especialmente no Paraná.'
    until: 2026-12-31
  - title: Programa Museu Educativo
    kind: Ação Educativa
    image: assets/eventos/programa-museu-educativo-4.webp
    url: https://www.instagram.com/p/DW4iAIGES1i/
    description: Contação de histórias do livro “A mão livre do vovô”, visita mediada e atividade
      arte-educativa.
    until: 2026-12-31
  - title: Editais de Ocupação do Museu de Arte de Londrina
    image: assets/eventos/editais-de-ocupacao-do-museu-de-arte-de-londrina-20260810.webp
    url: https://portal.londrina.pr.gov.br/espacos-culturais/museu-arte-sec-cultura
    description: Seleção de propostas para a realização de Exposições nas variadas linguagens da
      arte, incluindo trabalhos em pintura, desenhos, instalação, performance, fotografia,
      objeto tridimensional, escultura, vídeo, gravura e suas possíveis derivações e
      entrecruzamentos.
    until: 2026-10-09
    until_label: Inscrições até

